services:
  # Web Service
  - type: web
    name: karate-admin-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGO_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      - key: EMAIL_USER
        value: karatesubhash455@gmail.com
      - key: EMAIL_PASS
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: karate-redis
          property: connectionString
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: 5
      - key: CACHE_TTL_DASHBOARD
        value: 600
      - key: CACHE_TTL_STUDENT
        value: 300

  # Redis for Caching
  - type: redis
    name: karate-redis
    plan: free
    ipAllowList: []
